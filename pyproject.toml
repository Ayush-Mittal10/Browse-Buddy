[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-agent"
dynamic = ["version"]
description = "An LLM-driven browser automation agent that runs a real Chromium locally"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ayush Mittal" }]
keywords = ["browser", "automation", "agent", "playwright", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "playwright>=1.44.0",
]

[project.scripts]
browser-agent = "browser_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.hatch.version]
path = "browser_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["browser_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# snapshot.py embeds browser JavaScript as string literals. Wrapping those lines
# to Python's limit makes them harder to read, not easier.
"browser_agent/snapshot.py" = ["E501"]
# prompts.py is prose sent to the model. Its lines end in backslashes, so
# rewrapping the source would change the text the model reads.
"browser_agent/prompts.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
