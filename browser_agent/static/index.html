<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse Buddy</title>
<link rel="stylesheet" href="/static/theme.css">
<script>
  // Before first paint, so a returning visitor never sees the wrong theme
  // flash past on the way to the right one.
  try {
    const saved = localStorage.getItem('browse-buddy:theme');
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) { /* private mode */ }
</script>
</head>
<body>

<header>
  <h1>Browse Buddy</h1>
  <span class="sub" id="modelLabel">connecting…</span>
  <div class="right">
    <span class="sub" id="limits"></span>
    <span class="dot offline" id="dot"></span>
    <span class="sub" id="stateLabel">offline</span>
    <button id="themeToggle" type="button" title="Switch theme" aria-label="Switch theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>

<details id="settings">
  <summary>Model &amp; API key</summary>
  <div class="fields">
    <select id="provider"></select>
    <select id="model"></select>
    <input id="apiKey" type="password" placeholder="Your API key" autocomplete="off">
    <p class="hint" id="hint"></p>
  </div>
</details>

<main>
  <section id="chat">
    <div id="log"></div>
    <div id="suggestions"></div>
    <div id="composer">
      <div id="inputWrap"><textarea id="input" placeholder="Give it a task…" rows="1"></textarea></div>
      <button id="send" disabled>Run</button>
      <button id="stop" type="button" hidden>Stop</button>
    </div>
  </section>

  <div id="grip" title="Drag to resize · double-click to reset"></div>

  <section id="stage">
    <div id="screen">
      <div id="placeholder">
        <p>The browser appears here once a task starts.</p>
        <p>It runs on the server — you are watching a live stream of it, not your own browser.</p>
      </div>
    </div>
  </section>
</main>

<script>
const log = document.getElementById('log');
const screen = document.getElementById('screen');
const placeholder = document.getElementById('placeholder');
const input = document.getElementById('input');
const send = document.getElementById('send');
const stop = document.getElementById('stop');
const dot = document.getElementById('dot');
const stateLabel = document.getElementById('stateLabel');
const modelLabel = document.getElementById('modelLabel');
const limitsLabel = document.getElementById('limits');
const providerSelect = document.getElementById('provider');
const modelSelect = document.getElementById('model');
const apiKey = document.getElementById('apiKey');
const hint = document.getElementById('hint');
const chat = document.getElementById('chat');
const grip = document.getElementById('grip');
const suggestions = document.getElementById('suggestions');

let socket = null;
let state = 'offline';
let frame = null;
let settings = {};
let lastAgentText = '';

/* ---------- markdown ----------
   Small on purpose: agent reports use bold, bullets, links and the odd bit of
   code, and that is all this renders. Text is escaped FIRST and the formatting
   applied to the escaped string, so nothing a web page said can become markup
   here. The agent reads untrusted pages for a living. */

function escapeHtml(text) {
  return text.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function anchor(href, label) {
  return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
}

// Trailing punctuation usually belongs to the sentence, not the address. A
// closing bracket is the exception: it is part of the URL when the URL opened
// one itself, which is how half of Wikipedia's links are written.
function splitTrailing(url) {
  let end = url.length;
  while (end > 0) {
    const c = url[end - 1];
    if (c === ')' ) {
      const opens = (url.slice(0, end).match(/\(/g) || []).length;
      const closes = (url.slice(0, end).match(/\)/g) || []).length;
      if (closes <= opens) break;
    } else if (!'.,;:!?]}\'"'.includes(c)) {
      break;
    }
    end -= 1;
  }
  return [url.slice(0, end), url.slice(end)];
}

function inline(text) {
  let out = escapeHtml(text);

  // Finished fragments are parked behind a placeholder so that later passes
  // cannot reach inside them. Without this, a bare-URL pass would happily
  // rewrite the href of a link the markdown pass had just built.
  const held = [];
  const hold = (html) => `\u0000${held.push(html) - 1}\u0000`;

  out = out.replace(/`([^`]+)`/g, (_, code) => hold(`<code>${code}</code>`));
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (_, label, href) => hold(anchor(href, label)));

  // Bare URLs, which is how a model writes most of them. The escaping has
  // already happened, so a < in the original is now &lt; and would otherwise
  // be swallowed into the middle of an address; the lookahead stops at the
  // entities that were delimiters. &amp; is deliberately not among them, since
  // that is just a query string.
  out = out.replace(/https?:\/\/(?:(?!&(?:lt|gt|quot);)[^\s<>"])+/g, (url) => {
    const [link, tail] = splitTrailing(url);
    return link ? hold(anchor(link, link)) + tail : url;
  });

  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');

  return out.replace(/\u0000(\d+)\u0000/g, (_, i) => held[i]);
}

function markdown(text) {
  const html = [];
  let list = null;
  const closeList = () => { if (list) { html.push('</' + list + '>'); list = null; } };

  for (const raw of String(text).split('\n')) {
    const lineText = raw.trim();
    if (!lineText) { closeList(); continue; }

    const heading = lineText.match(/^(#{1,3})\s+(.*)$/);
    if (heading) {
      closeList();
      const level = heading[1].length;
      html.push(`<h${level}>${inline(heading[2])}</h${level}>`);
      continue;
    }

    const bullet = lineText.match(/^[-*•]\s+(.*)$/);
    const numbered = lineText.match(/^\d+[.)]\s+(.*)$/);
    if (bullet || numbered) {
      const want = bullet ? 'ul' : 'ol';
      if (list !== want) { closeList(); html.push('<' + want + '>'); list = want; }
      html.push(`<li>${inline((bullet || numbered)[1])}</li>`);
      continue;
    }

    closeList();
    html.push(`<p>${inline(lineText)}</p>`);
  }
  closeList();
  return html.join('');
}

/* ---------- chat ---------- */

function line(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  if (cls === 'agent') {
    lastAgentText = text;
    el.innerHTML = markdown(text);
  } else {
    el.textContent = text;
  }
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function step(detail) {
  const el = document.createElement('div');
  el.className = 'msg step';
  el.innerHTML = '<b>&rarr;</b> ';
  el.appendChild(document.createTextNode(detail));
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

/* ---------- the Run button says what it will do ---------- */

function refreshButton() {
  const busy = state === 'running' || state === 'queued';
  const connected = socket && socket.readyState === WebSocket.OPEN;
  const typed = input.value.trim().length > 0;

  // While a task runs the Run button is not what anyone wants to press, so
  // Stop takes its place rather than sitting next to it greyed out.
  send.hidden = busy;
  stop.hidden = !busy;
  send.classList.toggle('busy', busy);
  send.disabled = busy || !connected || !typed;
  send.textContent = busy ? 'Running' : 'Run';
  send.title = busy ? 'A task is already running'
    : !connected ? 'Not connected'
    : !typed ? 'Type a task first'
    : 'Run this task';
}

function setState(next) {
  if (next !== 'running' && next !== 'queued') {
    stop.disabled = false;
    stop.textContent = 'Stop';
  }
  state = next;
  dot.className = 'dot ' + next;
  stateLabel.textContent = next;
  input.disabled = next === 'running' || next === 'queued';
  setWorking(next === 'running' || next === 'queued');
  refreshButton();
}

function showFrame(data) {
  if (!frame) {
    placeholder.remove();
    frame = document.createElement('img');
    frame.alt = 'The page the agent is looking at';
    screen.appendChild(frame);
  }
  frame.src = 'data:image/jpeg;base64,' + data;
}

/* ---------- settings ---------- */

function fill(select, values, labels) {
  select.innerHTML = '';
  values.forEach((value, i) => {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = labels ? labels[i] : value;
    select.appendChild(option);
  });
}

// The header should say what will run before anything has run. Separate from
// refreshModels, which rebuilds the list and would discard the selection.
function refreshLabel() {
  const provider = providerSelect.value;
  const chosen = modelSelect.value || (settings.models || {})[provider]?.[0] || '';
  if (provider) modelLabel.textContent = chosen ? `${provider} · ${chosen}` : provider;
}

function refreshModels() {
  const provider = providerSelect.value;
  const models = (settings.models || {})[provider] || [];
  // A list, not a text box: a typo here is a 404 from the provider and a
  // confusing error in the chat.
  fill(modelSelect, [''].concat(models), ['default'].concat(models));
  modelSelect.disabled = models.length === 0;

  const needsKey = !(settings.server_providers || []).includes(provider);
  const canBring = (settings.byok_providers || []).includes(provider);
  apiKey.style.display = canBring ? '' : 'none';
  apiKey.placeholder = needsKey ? 'Your API key (required)' : 'Your API key (optional)';
  hint.textContent = needsKey
    ? 'Your key is used for this session only — never stored, never logged.'
    : 'Runs on the host key. Pick another provider above to use your own.';
  refreshLabel();
}

async function loadConfig() {
  settings = await (await fetch('/api/config')).json();

  const providers = (settings.server_providers || []).slice();
  for (const name of settings.byok_providers || []) {
    if (!providers.includes(name)) providers.push(name);
  }
  const labels = providers.map((name) =>
    settings.server_providers.includes(name) ? name + ' (no key needed)' : name + ' (your key)');

  if (providers.length) fill(providerSelect, providers, labels);
  else fill(providerSelect, [''], ['no model configured']);
  refreshModels();

  // Somewhere to start for a visitor who has not thought of a task.
  suggestions.innerHTML = '';
  for (const text of settings.suggestions || []) {
    const pill = document.createElement('button');
    pill.className = 'pill';
    pill.type = 'button';
    pill.textContent = text;
    pill.addEventListener('click', () => {
      input.value = text;
      input.focus();
      refreshButton();
    });
    suggestions.appendChild(pill);
  }

  const only = (settings.allowed_domains || []).length
    ? ' · only ' + settings.allowed_domains.join(', ') : '';
  limitsLabel.textContent = `${settings.max_steps} steps · ${settings.max_tasks} tasks${only}`;
}

providerSelect.addEventListener('change', refreshModels);
modelSelect.addEventListener('change', refreshLabel);

/* ---------- drag to resize ---------- */

const SAVED_WIDTH = 'browser-agent:chat-width';

function setChatWidth(px) {
  const width = Math.max(260, Math.min(px, window.innerWidth - 320));
  chat.style.width = width + 'px';
  try { localStorage.setItem(SAVED_WIDTH, String(width)); } catch (e) { /* private mode */ }
}

try {
  const saved = parseInt(localStorage.getItem(SAVED_WIDTH), 10);
  if (saved) setChatWidth(saved);
} catch (e) { /* private mode */ }

grip.addEventListener('pointerdown', (event) => {
  event.preventDefault();
  grip.setPointerCapture(event.pointerId);
  grip.classList.add('dragging');
  document.body.classList.add('resizing');

  const move = (e) => setChatWidth(e.clientX - chat.getBoundingClientRect().left);
  const up = () => {
    grip.releasePointerCapture(event.pointerId);
    grip.classList.remove('dragging');
    document.body.classList.remove('resizing');
    grip.removeEventListener('pointermove', move);
    grip.removeEventListener('pointerup', up);
  };
  grip.addEventListener('pointermove', move);
  grip.addEventListener('pointerup', up);
});

grip.addEventListener('dblclick', () => setChatWidth(420));

/* ---------- socket ---------- */

function connect() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  socket = new WebSocket(`${scheme}://${location.host}/ws`);

  socket.onopen = () => setState('idle');
  socket.onclose = () => setState('offline');
  socket.onerror = () => setState('error');

  socket.onmessage = (event) => {
    const message = JSON.parse(event.data);
    switch (message.type) {
      case 'frame':     showFrame(message.data); break;
      case 'narration': line('agent', message.text); break;
      case 'action':    step(message.detail); break;
      case 'ready':     modelLabel.textContent = `${message.provider} · ${message.model}`; break;
      case 'status':    setState(message.state); break;
      case 'media':     handOver(message); break;
      case 'error':     line('bad', message.text); setState('idle'); break;
      case 'report':
        // When the model answers in text instead of calling finish_task, the
        // narration and the report are the same words. Show them once.
        if (message.text && message.text !== lastAgentText) line('agent', message.text);
        // Nothing for 'stopped': it was asked for, and the report already
        // says how to carry on. Telling someone who pressed stop that they
        // are out of budget is both wrong and a repeat.
        if (message.state === 'in_progress') line('note', 'Out of budget — say "continue" to carry on.');
        if (message.state === 'finished') line('note', 'Ask a follow-up, or something else entirely.');
        break;
    }
  };
}

function submit() {
  const message = input.value.trim();
  if (send.disabled || !message) return;
  line('you', message);
  socket.send(JSON.stringify({
    message,
    provider: providerSelect.value,
    api_key: apiKey.value.trim(),
    model: modelSelect.value,
  }));
  input.value = '';
  input.style.height = 'auto';
  refreshButton();
}

send.addEventListener('click', submit);
stop.addEventListener('click', () => {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify({ type: 'stop' }));
  stop.disabled = true;
  stop.textContent = 'Stopping';
});
input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); submit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  refreshButton();
});

loadConfig().then(connect);
/* ---------- theme ----------
   Light unless the visitor says otherwise. Their choice is remembered and
   beats the system preference; until they make one, the system decides. */

const themeToggle = document.getElementById('themeToggle');
const screenBox = document.getElementById('screen');
const inputWrap = document.getElementById('inputWrap');

function systemPrefersDark() {
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function currentTheme() {
  return document.documentElement.dataset.theme || (systemPrefersDark() ? 'dark' : 'light');
}

themeToggle.addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('browse-buddy:theme', next); } catch (e) { /* private mode */ }
});

/* ---------- handing a video over ----------
   The browser doing the work has no speakers, so anything meant to be watched
   is opened where the person actually is. Opening it for them needs the
   browser's permission: a popup is only allowed shortly after a click, and a
   task takes far longer than that, so this tries and then copes with being
   refused rather than pretending it worked. */

const AUTO_OPEN = 'browse-buddy:auto-open';

function autoOpenWanted() {
  try { return localStorage.getItem(AUTO_OPEN) !== 'off'; } catch (e) { return true; }
}

function handOver(info) {
  const opened = autoOpenWanted() && tryOpen(info.url);
  const card = document.createElement('div');
  card.className = 'msg agent media-card';

  const label = document.createElement('div');
  label.className = 'media-title';
  label.textContent = opened
    ? 'Opened in a new tab — it plays there, with sound.'
    : 'Ready to play, with sound:';
  card.appendChild(label);

  const link = document.createElement('a');
  link.className = 'media-open';
  link.href = info.url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.textContent = opened ? info.url : 'Open in a new tab';
  card.appendChild(link);

  if (!opened && autoOpenWanted()) {
    const note = document.createElement('p');
    note.className = 'media-note';
    note.textContent =
      'Your browser blocked the new tab. Allow pop-ups for this site and the '
      + 'next one opens by itself.';
    card.appendChild(note);
  }

  log.appendChild(card);
  log.scrollTop = log.scrollHeight;
}

function tryOpen(url) {
  // A blocked popup comes back as null rather than throwing, so the return
  // value is the only way to tell whether it actually happened.
  //
  // Deliberately NOT window.open(url, '_blank', 'noopener'): that form returns
  // null even on success, which made this report every opened tab as blocked.
  // Clearing opener afterwards gives the same protection and still answers.
  try {
    const w = window.open(url, '_blank');
    if (!w) return false;
    try { w.opener = null; } catch (e) { /* cross-origin, already safe */ }
    return true;
  } catch (e) {
    return false;
  }
}

/* ---------- the working animation ----------
   On only while the agent is actually doing something. An idle page that
   glows is just noise, and after ten seconds it reads as broken. */

function setWorking(on) {
  screenBox.classList.toggle('thinking', on);
  // The wrapper, not the textarea: a replaced element has no ::before to
  // draw a ring on.
  inputWrap.classList.toggle('thinking', on);
}
</script>
</body>
</html>
