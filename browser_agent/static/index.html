<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Agent</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --line: #272b35;
    --text: #e6e8ee;
    --dim: #8b93a7;
    --accent: #6ea8fe;
    --ok: #57c98a;
    --warn: #e0b44c;
    --bad: #e06c75;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 13px; }
  header .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.running { background: var(--accent); animation: pulse 1.1s infinite; }
  .dot.idle { background: var(--ok); }
  .dot.queued { background: var(--warn); }
  .dot.error { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .3; } }

  select, input, button, textarea {
    font: inherit;
    color: var(--text);
    background: #1c202a;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
  }
  button { cursor: pointer; background: var(--accent); color: #0b0d12; border: 0; font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input::placeholder, textarea::placeholder { color: #5d6478; }

  main { flex: 1; display: flex; min-height: 0; }

  #chat {
    width: 420px;
    min-width: 320px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    background: var(--panel);
  }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }

  .msg { padding: 9px 12px; border-radius: var(--radius); max-width: 92%; white-space: pre-wrap; word-break: break-word; }
  .msg.you { align-self: flex-end; background: #2a3550; }
  .msg.agent { background: #1c202a; border: 1px solid var(--line); }
  .msg.note { color: var(--dim); font-size: 13px; padding: 2px 4px; background: none; }
  .msg.step { color: var(--dim); font-size: 13px; padding: 1px 4px; background: none; font-variant-numeric: tabular-nums; }
  .msg.step b { color: var(--accent); font-weight: 500; }
  .msg.bad { color: var(--bad); background: #2a1a1c; border: 1px solid #45262a; }

  #composer { border-top: 1px solid var(--line); padding: 12px; display: flex; gap: 8px; }
  #composer textarea { flex: 1; resize: none; height: 44px; max-height: 140px; overflow-y: auto; }

  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #0b0d12; }
  #screen { flex: 1; display: grid; place-items: center; padding: 16px; min-height: 0; }
  #screen img { max-width: 100%; max-height: 100%; border-radius: var(--radius); box-shadow: 0 8px 40px #0008; }
  #placeholder { color: var(--dim); text-align: center; max-width: 380px; }
  #placeholder code { background: #1c202a; padding: 2px 6px; border-radius: 5px; font-size: 13px; }

  details#settings { border-bottom: 1px solid var(--line); background: var(--panel); }
  details#settings summary { padding: 9px 14px; cursor: pointer; color: var(--dim); font-size: 13px; }
  .fields { padding: 0 14px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .fields input { flex: 1; min-width: 220px; }
  .hint { color: var(--dim); font-size: 12px; width: 100%; margin: 0; }

  @media (max-width: 860px) {
    main { flex-direction: column; }
    #chat { width: auto; border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Browser Agent</h1>
  <span class="sub" id="modelLabel">connecting…</span>
  <div class="right">
    <span class="dot" id="dot"></span>
    <span class="sub" id="stateLabel">offline</span>
  </div>
</header>

<details id="settings">
  <summary>Model &amp; API key</summary>
  <div class="fields">
    <select id="provider"></select>
    <input id="apiKey" type="password" placeholder="Your API key (optional)" autocomplete="off">
    <input id="model" placeholder="Model (optional)">
    <p class="hint" id="hint"></p>
  </div>
</details>

<main>
  <section id="chat">
    <div id="log"></div>
    <div id="composer">
      <textarea id="input" placeholder="Give it a task…" rows="1"></textarea>
      <button id="send">Run</button>
    </div>
  </section>

  <section id="stage">
    <div id="screen">
      <div id="placeholder">
        <p>The browser appears here once a task starts.</p>
        <p>It runs on the server — you are watching a live stream of it, not your own browser.</p>
      </div>
    </div>
  </section>
</main>

<script>
const log = document.getElementById('log');
const screen = document.getElementById('screen');
const placeholder = document.getElementById('placeholder');
const input = document.getElementById('input');
const send = document.getElementById('send');
const dot = document.getElementById('dot');
const stateLabel = document.getElementById('stateLabel');
const modelLabel = document.getElementById('modelLabel');
const providerSelect = document.getElementById('provider');
const apiKey = document.getElementById('apiKey');
const modelInput = document.getElementById('model');
const hint = document.getElementById('hint');

let socket = null;
let running = false;
let frame = null;
let settings = {};

function line(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function step(detail) {
  const el = document.createElement('div');
  el.className = 'msg step';
  el.innerHTML = '<b>→</b> ';
  el.appendChild(document.createTextNode(detail));
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function setState(state) {
  dot.className = 'dot ' + state;
  stateLabel.textContent = state;
  running = state === 'running' || state === 'queued';
  send.disabled = running;
  input.disabled = running;
}

function showFrame(data) {
  if (!frame) {
    placeholder.remove();
    frame = document.createElement('img');
    frame.alt = 'The page the agent is looking at';
    screen.appendChild(frame);
  }
  frame.src = 'data:image/jpeg;base64,' + data;
}

async function loadConfig() {
  const response = await fetch('/api/config');
  settings = await response.json();

  const options = [];
  for (const name of settings.server_providers) options.push([name, name + ' (no key needed)']);
  for (const name of settings.byok_providers) {
    if (!settings.server_providers.includes(name)) options.push([name, name + ' (bring your own key)']);
  }
  if (!options.length) options.push(['', 'no model configured']);

  providerSelect.innerHTML = '';
  for (const [value, label] of options) {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = label;
    providerSelect.appendChild(option);
  }
  updateHint();

  const limits = `${settings.max_steps} steps · ${settings.max_tasks} tasks per session`;
  const only = settings.allowed_domains.length
    ? ` · limited to ${settings.allowed_domains.join(', ')}`
    : '';
  modelLabel.textContent = limits + only;
}

function updateHint() {
  const provider = providerSelect.value;
  const needsKey = !settings.server_providers?.includes(provider);
  apiKey.style.display = settings.byok_providers?.includes(provider) ? '' : 'none';
  apiKey.placeholder = needsKey ? 'Your API key (required)' : 'Your API key (optional)';
  hint.textContent = needsKey
    ? 'Your key is used for this session only — never stored, never logged.'
    : 'Runs on the host key. Add your own above to use a different model.';
}

providerSelect.addEventListener('change', updateHint);

function connect() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  socket = new WebSocket(`${scheme}://${location.host}/ws`);

  socket.onopen = () => setState('idle');
  socket.onclose = () => { setState('offline'); send.disabled = true; };
  socket.onerror = () => setState('error');

  socket.onmessage = (event) => {
    const message = JSON.parse(event.data);
    switch (message.type) {
      case 'frame':     showFrame(message.data); break;
      case 'narration': line('agent', message.text); break;
      case 'action':    step(message.detail); break;
      case 'ready':     modelLabel.textContent = `${message.provider} · ${message.model}`; break;
      case 'status':    setState(message.state); break;
      case 'error':     line('bad', message.text); setState('idle'); break;
      case 'report':
        line('agent', message.text);
        if (message.state === 'in_progress') line('note', 'Out of budget — say "continue" to carry on.');
        if (message.state === 'finished') line('note', 'The browser closed. Ask something else to start again.');
        break;
    }
  };
}

function submit() {
  const message = input.value.trim();
  if (!message || running || !socket || socket.readyState !== WebSocket.OPEN) return;
  line('you', message);
  socket.send(JSON.stringify({
    message,
    provider: providerSelect.value,
    api_key: apiKey.value.trim(),
    model: modelInput.value.trim(),
  }));
  input.value = '';
  input.style.height = 'auto';
}

send.addEventListener('click', submit);
input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); submit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

loadConfig().then(connect);
</script>
</body>
</html>
